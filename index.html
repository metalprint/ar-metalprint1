<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
    <meta charset="UTF-8" />
    <title>WebAR - Metalprint 30x60</title>

    <!-- Подключение A-Frame и MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body { 
        width: 100%;
        height: 100%;
        overflow: hidden; 
        background: transparent !important;
      }
      
      a-scene, canvas {
        background-color: transparent !important;
      }

      /* Скрываем стандартный кольцевой индикатор загрузки MindAR */
      .mindar-ui-loading { 
        display: none !important; 
      }

      /* Квадратный логотип снизу слева */
      #brand-logo {
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 9999;
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 14px;
        pointer-events: none;
        background-color: #000000;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }

      /* Кнопка звука снизу справа */
      #sound-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        padding: 12px 22px;
        font-size: 14px;
        font-weight: bold;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.75);
        border: 2px solid #ff0055;
        border-radius: 30px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }

      #sound-btn:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <!-- Квадратный логотип слева и кнопка звука справа -->
    <img id="brand-logo" src="./logo.jpg" alt="Metalprint Logo" onerror="this.style.display='none'" />
    <button id="sound-btn">🔊 Включить звук</button>

    <!-- AR Сцена с фильтрами сглаживания Калмана (убирает дрожание)[cite: 3] -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
      embedded
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Подгрузка видеофайла 720x1440[cite: 3] -->
        <video 
          id="ar-video" 
          src="./video.mp4" 
          preload="auto" 
          loop 
          crossorigin="anonymous" 
          webkit-playsinline 
          playsinline 
          muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Наложение видео с пропорциями 1:2 под панель 30x60 см[cite: 3] -->
      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        <a-video src="#ar-video" width="1" height="2" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const soundBtn = document.getElementById("sound-btn");
        const video = document.querySelector("#ar-video");
        const targetEntity = document.querySelector("#target-entity");
        const sceneEl = document.querySelector("a-scene");

        // Фикс прозрачности фона камеры
        sceneEl.addEventListener("arReady", () => {
          const videoElements = document.querySelectorAll("video");
          videoElements.forEach((el) => {
            if (el.id !== "ar-video") {
              el.style.position = "fixed";
              el.style.top = "0";
              el.style.left = "0";
              el.style.width = "100%";
              el.style.height = "100%";
              el.style.objectFit = "cover";
              el.style.zIndex = "-1";
            }
          });
        });

        // Управление звуком через кнопку справа
        soundBtn.addEventListener("click", () => {
          if (video.muted) {
            video.muted = false;
            soundBtn.innerText = "🔊 Звук включен";
            soundBtn.style.borderColor = "#00ff88";
          } else {
            video.muted = true;
            soundBtn.innerText = "🔇 Включить звук";
            soundBtn.style.borderColor = "#ff0055";
          }
        });

        // Автовоспроизведение при наведении на металлическую панель[cite: 3]
        targetEntity.addEventListener("targetFound", () => {
          video.play().catch(error => {
            console.log("Ошибка автовоспроизведения:", error);
          });
        });

        // Пауза при уходе камеры с картины[cite: 3]
        targetEntity.addEventListener("targetLost", () => {
          video.pause();
        });
      });
    </script>
  </body>
</html>
