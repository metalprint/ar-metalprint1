<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Подключение A-Frame и MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
      }
      
      /* Скрываем стандартный кольцевой индикатор загрузки MindAR */
      .mindar-ui-loading { 
        display: none !important; 
      }

      /* Плашка-подсказка для включения звука */
      #sound-hint {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        padding: 10px 18px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>
    <!-- Подсказка для активации звука кликом -->
    <div id="sound-hint">🔊 Нажмите на экран, чтобы включить звук</div>

    <!-- AR Сцена с фильтрами сглаживания Калмана (убирает дрожание) -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Подгрузка видеофайла 720x1440 -->
        <video 
          id="ar-video" 
          src="./video.mp4" 
          preload="auto" 
          loop 
          crossorigin="anonymous" 
          webkit-playsinline 
          playsinline 
          muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Наложение видео с пропорциями 1:2 (width="1" height="2" под панель 30x60 см) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#ar-video" width="1" height="2" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const targetEntity = document.querySelector('[mindar-image-target]');
      const video = document.querySelector('#ar-video');
      const soundHint = document.querySelector('#sound-hint');

      // Включение звука при первом клике/тапе по экрану
      document.body.addEventListener('click', () => {
        if (video) {
          video.muted = false;
        }
        if (soundHint) {
          soundHint.style.opacity = '0';
          setTimeout(() => soundHint.remove(), 400);
        }
      }, { once: true });

      // Автовоспроизведение при наведении на металлическую панель
      targetEntity.addEventListener("targetFound", () => {
        video.play().catch(error => {
          console.log("Ошибка автовоспроизведения:", error);
        });
      });

      // Пауза при уходе камеры с картины
      targetEntity.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
